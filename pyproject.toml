[project]
name = "markdown-intercom"
version = "0.1.0.dev1"
description = "Agents talking through Markdown"
readme = "./README.md"
authors = [
  { name = "Diógenes Oliveira", email = "diogenes1oliveira@gmail.com" },
]
requires-python = ">=3.9"

dependencies = [
  "mdx-outline",
  "mkdocs>=1.6.1",
  "mkdocs-gen-files>=0.6.0",
  "mkdocs-material>=9.7.1",
  "mkdocs-section-index>=0.3.10",
  "pathspec>=0.12.0",
]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.uv]
native-tls = true
package = false

[tool.uv.sources]
mdx-outline = { git = "https://github.com/diogenes1oliveira/mdx_outline.git" }

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "ruff>=0.14.5",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
disable_error_code = ["comparison-overlap", "type-abstract"]

[tool.ruff]
target-version = "py39"
line-length = 120
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long, handled by black
  "B008", # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
