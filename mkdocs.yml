site_name: Markdown Intercom
site_description: Agents talking through Markdown
site_author: Diógenes Oliveira
site_url: https://diogenes1oliveira.github.io/markdown-intercom/

nav:
  - Home: index.md
  - Index: devindex.md
  - Agents: AGENTS.md
  - Architecture: ARCHITECTURE.md
  - Development: DEVELOPMENT.md
  - CI Tests: CI.md
  - Examples:
      - Index: examples/devindex.md
      - Fix Apt Update Warning:
          - README: examples/fix-apt-update-warning/README.md
          - Index: examples/fix-apt-update-warning/devindex.md
          - AGENTS: examples/fix-apt-update-warning/AGENTS.md
      - Scaffold MkDocs:
          - README: examples/scaffold-mkdocs/README.md
          - Index: examples/scaffold-mkdocs/devindex.md

plugins:
  - search
  - section-index
  - privacy
  - tags
  - htmlproofer:
      enabled: !ENV [CI, false]
      raise_error: true  # Fail build on broken links
  - gen-files:
      scripts:
        - src/mkdocs_customize/gen_pages.py

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - mdx_outline
